<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firestore Sync Diagnostic — itqhrms</title>
<style>
  body { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; background:#f4f1ea;
         color:#1a2733; margin:0; padding:32px; font-size:13.5px; line-height:1.6; }
  .wrap { max-width: 820px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#8a96a3; margin-bottom:24px; }
  .row { display:flex; gap:12px; padding:11px 14px; border:1px solid #d9d2c2; border-top:none;
         background:#fff; align-items:flex-start; }
  .row:first-of-type { border-top:1px solid #d9d2c2; border-radius:6px 6px 0 0; }
  .row:last-of-type { border-radius:0 0 6px 6px; }
  .mark { width:18px; flex:0 0 18px; font-weight:700; }
  .ok   { color:#2e6b4a; }
  .bad  { color:#b3413a; }
  .wait { color:#8a96a3; }
  .name { flex:0 0 210px; font-weight:600; }
  .msg  { flex:1; color:#4a5b6c; word-break:break-word; }
  .verdict { margin-top:24px; padding:16px 18px; border-radius:6px; border:1px solid #d9d2c2;
             background:#fff; display:none; }
  .verdict.show { display:block; }
  .verdict h2 { font-size:14px; margin:0 0 8px; }
  code { background:#e8e3d6; padding:1px 5px; border-radius:3px; }
  pre { background:#1a2733; color:#e8e3d6; padding:14px; border-radius:6px; overflow-x:auto;
        font-size:12px; }
  button { font:inherit; padding:9px 18px; border-radius:6px; border:1px solid #1f4d4a;
           background:#1f4d4a; color:#fff; cursor:pointer; margin-bottom:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Firestore Sync Diagnostic</h1>
  <div class="sub">Project <strong>itqhrms</strong> &middot; collection <strong>payroll_store</strong></div>
  <button onclick="location.reload()">Run again</button>
  <div id="rows"></div>
  <div class="verdict" id="verdict"></div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC9zGtr2uBd4dbJVqcI2lKspY1H0QdiV0Q",
  authDomain:        "itqhrms.firebaseapp.com",
  projectId:         "itqhrms",
  storageBucket:     "itqhrms.firebasestorage.app",
  messagingSenderId: "1051739679961",
  appId:             "1:1051739679961:web:e6405e8e5fc054c104e2c8"
};
const SDK = 'https://www.gstatic.com/firebasejs/10.13.2/';
const COL = 'payroll_store';

const rowsEl = document.getElementById('rows');
const steps = {};
function step(id, name) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = '<div class="mark wait">&middot;</div><div class="name">' + name +
                 '</div><div class="msg">running&hellip;</div>';
  rowsEl.appendChild(el);
  steps[id] = el;
  return el;
}
function mark(id, ok, msg) {
  const el = steps[id];
  el.querySelector('.mark').className = 'mark ' + (ok ? 'ok' : 'bad');
  el.querySelector('.mark').textContent = ok ? '\u2713' : '\u2717';
  el.querySelector('.msg').textContent = msg;
}
function verdict(title, html) {
  const v = document.getElementById('verdict');
  v.className = 'verdict show';
  v.innerHTML = '<h2>' + title + '</h2>' + html;
}

const CODES = {
  'permission-denied':
    'Your Firestore rules are rejecting the request. This is what you get if the Tier 2 rules ' +
    'are published (they require request.auth != null) but the app never signs in to Firebase Auth. ' +
    'Switch to the Tier 1 block in firestore.rules to confirm everything else works.',
  'unavailable':
    'The browser could not reach Firestore. Usually a network block, a corporate proxy, an ad/tracker ' +
    'blocker eating googleapis.com, or the page being offline.',
  'failed-precondition':
    'Most often: the Firestore database has not been created in this project yet. Open the console, ' +
    'Build \u2192 Firestore Database \u2192 Create database (asia-south1, production mode).',
  'not-found':
    'Project or database not found. Check that projectId is exactly "itqhrms" and that Firestore ' +
    '(not just Realtime Database) has been created.',
  'invalid-argument':
    'The config values are malformed \u2014 recheck apiKey / projectId against the console.',
  'unauthenticated':
    'Rules demand a signed-in user and there is none. Same fix as permission-denied.'
};

(async () => {
  step('proto', 'Page origin');
  const proto = location.protocol;
  if (proto === 'file:') {
    mark('proto', false, 'Opened as file:// \u2014 IndexedDB and some network calls are restricted. ' +
         'Serve over http instead (see verdict below).');
  } else {
    mark('proto', true, proto + '//' + location.host + ' \u2014 fine');
  }

  let appMod, fsMod, app, db;

  step('sdk', 'Load Firebase SDK');
  try {
    appMod = await import(SDK + 'firebase-app.js');
    fsMod  = await import(SDK + 'firebase-firestore.js');
    mark('sdk', true, 'v10.13.2 loaded from gstatic.com');
  } catch (e) {
    mark('sdk', false, e.message);
    return verdict('SDK could not load',
      '<p>The browser could not fetch the Firebase SDK from <code>gstatic.com</code>. ' +
      'Check your internet connection, and any ad blocker or firewall that might be blocking Google domains.</p>');
  }

  step('init', 'Initialise app');
  try {
    app = appMod.initializeApp(FIREBASE_CONFIG);
    db  = fsMod.getFirestore(app);
    mark('init', true, 'projectId = ' + FIREBASE_CONFIG.projectId);
  } catch (e) {
    mark('init', false, e.message);
    return verdict('Config is invalid', '<p>' + e.message + '</p>');
  }

  const testRef = fsMod.doc(db, COL, '__diagnostic__');

  step('write', 'Write test document');
  try {
    await fsMod.setDoc(testRef, { key: '__diagnostic__', value: 'hello', updatedAt: Date.now() });
    mark('write', true, 'wrote ' + COL + '/__diagnostic__');
  } catch (e) {
    mark('write', false, (e.code || '?') + ' \u2014 ' + e.message);
    return verdict('Write blocked \u2014 <code>' + (e.code || 'unknown') + '</code>',
      '<p>' + (CODES[e.code] || e.message) + '</p>');
  }

  step('read', 'Read it back');
  try {
    const s = await fsMod.getDoc(testRef);
    mark('read', s.exists(), s.exists() ? 'value = ' + s.data().value : 'document missing');
  } catch (e) {
    mark('read', false, (e.code || '?') + ' \u2014 ' + e.message);
    return verdict('Read blocked \u2014 <code>' + (e.code || 'unknown') + '</code>',
      '<p>' + (CODES[e.code] || e.message) + '</p>');
  }

  step('listen', 'Realtime listener (onSnapshot)');
  const listened = await new Promise(resolve => {
    const t = setTimeout(() => resolve({ ok: false, msg: 'no snapshot within 8s' }), 8000);
    const un = fsMod.onSnapshot(fsMod.collection(db, COL),
      snap => { clearTimeout(t); un();
                resolve({ ok: true, msg: snap.size + ' document(s) in collection, live' }); },
      err  => { clearTimeout(t); resolve({ ok: false, msg: (err.code || '?') + ' \u2014 ' + err.message, code: err.code }); });
  });
  mark('listen', listened.ok, listened.msg);

  step('clean', 'Remove test document');
  try { await fsMod.deleteDoc(testRef); mark('clean', true, 'deleted'); }
  catch (e) { mark('clean', false, e.message); }

  if (!listened.ok) {
    return verdict('Listener failed',
      '<p>' + (CODES[listened.code] || listened.msg) + '</p>');
  }

  verdict('Everything works \u2705',
    '<p>Reads, writes and the realtime listener all succeeded against project <code>itqhrms</code>. ' +
    'If <code>index.html</code> still is not syncing, the problem is in that file rather than in ' +
    'Firebase \u2014 open DevTools \u2192 Console there and check for errors.</p>' +
    '<p>Also open the app in two browser windows side by side: add an employee in one, and it should ' +
    'appear in the other within about a second.</p>');
})().catch(e => {
  verdict('Unexpected failure', '<pre>' + (e && e.stack ? e.stack : e) + '</pre>');
});
</script>
</body>
</html>
