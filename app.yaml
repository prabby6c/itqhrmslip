# DigitalOcean App Platform spec — static site.
# Push this repo to GitHub, then: Apps -> Create App -> pick the repo.
# DO auto-detects this file. Static sites are free on App Platform.
name: innovationtq-payroll
region: blr           # Bangalore — closest DO region to Chennai
static_sites:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    error_document: index.html
    routes:
      - path: /
